    <script>
      // Gracefully handle preview environment WebSocket/HMR disconnects
      window.addEventListener('error', function (event) {
        if (
          event &&
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('@vite/client') || event.message.includes('ws'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event &&
          event.reason &&
          event.reason.message &&
          (event.reason.message.includes('WebSocket') || event.reason.message.includes('vite'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
