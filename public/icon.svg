<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Radiating heat waves -->
  <circle cx="256" cy="180" r="140" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="180" r="170" fill="none" stroke="#fed7aa" stroke-width="3" stroke-dasharray="12 12" opacity="0.3"/>

  <!-- Shield protection outline -->
  <path d="M 256 90 L 370 145 C 370 270 295 365 256 410 C 217 365 142 270 142 145 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Inner shield core -->
  <path d="M 256 115 L 345 160 C 345 260 285 340 256 380 C 227 340 167 260 167 160 Z" 
        fill="#1c1917" opacity="0.9"/>

  <!-- Sun symbol -->
  <circle cx="256" cy="200" r="38" fill="#f59e0b"/>
  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="145" x2="256" y2="132"/>
    <line x1="256" y1="255" x2="256" y2="268"/>
    <line x1="201" y1="200" x2="188" y2="200"/>
    <line x1="311" y1="200" x2="324" y2="200"/>
    <line x1="217" y1="161" x2="208" y2="152"/>
    <line x1="295" y1="239" x2="304" y2="248"/>
    <line x1="217" y1="239" x2="208" y2="248"/>
    <line x1="295" y1="161" x2="304" y2="152"/>
  </g>

  <!-- Thermometer overlay inside shield -->
  <g transform="translate(256, 280)">
    <!-- Bulb base -->
    <circle cx="0" cy="35" r="22" fill="#ef4444"/>
    <!-- Tube stem -->
    <rect x="-8" y="-40" width="16" height="60" rx="8" fill="#f8fafc"/>
    <rect x="-4" y="-30" width="8" height="55" rx="4" fill="#ef4444"/>
  </g>

  <!-- Tamil/English Brand Text Accent -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">CHENNAI HEAT GUARD</text>
</svg>
